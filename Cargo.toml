[package]
name = "looker-cst"
version = "0.1.0"
edition = "2024"
description = "Lossless concrete syntax tree parser for LookML with Python bindings"

[lib]
name = "looker_cst"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin when building the Python extension module.
python = ["dep:pyo3"]

[dependencies]
nom = "8.0.0"
parking_lot = "0.12.5"
pyo3 = { version = "0.29.3", features = ["abi3-py39", "extension-module", "multiple-pymethods"], optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parse"
harness = false
